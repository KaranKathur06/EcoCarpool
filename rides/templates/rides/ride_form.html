{% extends 'base.html' %}
{% load static %}

{% block title %}Create New Ride - EcoCarpool{% endblock %}

{% block content %}
<div class="container py-4">
    <form method="post" novalidate>
        {% csrf_token %}
        <!-- Route Information Card -->
        <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Route Information</h5>
                <div class="mb-3">
                    <label class="form-label">Departure Location <span class="text-danger">*</span></label>
                    <input type="text" name="start_location" class="form-control" placeholder="Enter departure location" required>
            </div>
                <div class="mb-3">
                    <label class="form-label">Destination <span class="text-danger">*</span></label>
                    <input type="text" name="end_location" class="form-control" placeholder="Enter destination" required>
                </div>
                <!-- Google Map -->
                <div id="map" style="height:220px; border-radius:12px;"></div>
            </div>
        </div>

        <!-- Date & Time Card -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Date & Time</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Date <span class="text-danger">*</span></label>
                        <input type="date" name="ride_date" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Time <span class="text-danger">*</span></label>
                        <input type="time" name="ride_time" class="form-control" required>
                    </div>
                </div>
                        </div>
                    </div>

        <!-- Ride Details Card -->
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-3">Ride Details</h5>
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">Available Seats <span class="text-danger">*</span></label>
                            <input type="number" name="available_seats" class="form-control" min="1" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Price per Seat <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" name="price_per_seat" class="form-control" min="0" step="0.01" required>
                            </div>
                        </div>
                    <div class="col-md-4">
                        <label class="form-label">Vehicle <span class="text-danger">*</span></label>
                        <select name="vehicle" id="id_vehicle" class="form-select" required>
                            <option value="">Select a vehicle</option>
                        </select>
                    </div>
                </div>
                <div class="mt-3">
                    <label class="form-label">Notes</label>
                    <textarea name="description" class="form-control" rows="2" maxlength="500" placeholder="Add any additional information about the ride (optional)"></textarea>
                    <div class="text-end small text-muted"><span id="desc-count">0</span>/500</div>
                </div>
                    </div>
                </div>

                <!-- Form Actions -->
        <div class="d-flex gap-3">
            <a href="javascript:history.back()" class="btn btn-link">Cancel</a>
            <button type="submit" class="btn btn-primary">Create Ride</button>
        </div>
    </form>
</div>

{% endblock %}

{% block extra_js %}
<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<!-- Leaflet Routing Machine -->
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Load user's vehicles
    fetch('/rides/api/vehicles/')
        .then(response => response.json())
        .then(vehicles => {
            const vehicleSelect = document.getElementById('id_vehicle');
            vehicles.forEach(vehicle => {
                const option = document.createElement('option');
                option.value = vehicle.id;
                option.textContent = `${vehicle.brand} ${vehicle.model} (${vehicle.license_plate}) - ${vehicle.seats} seats`;
                vehicleSelect.appendChild(option);
            });
        });

    // Description character count
    const desc = document.querySelector('textarea[name="description"]');
    const descCount = document.getElementById('desc-count');
    if (desc && descCount) {
        desc.addEventListener('input', function() {
            descCount.textContent = desc.value.length;
        });
    }

    // Initialize map
    var map = L.map('map').setView([22.5726, 88.3639], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Initialize routing control
    var routingControl = L.Routing.control({
        waypoints: [],
        routeWhileDragging: true,
        show: false,
        addWaypoints: false,
        draggableWaypoints: false,
        lineOptions: {
            styles: [{ color: '#6366f1', weight: 4 }]
        }
    }).addTo(map);

    // Initialize markers
    var startMarker = null;
    var endMarker = null;
    var isSelectingStart = true;

    // Function to update route
    function updateRoute() {
        if (startMarker && endMarker) {
            routingControl.setWaypoints([
                startMarker.getLatLng(),
                endMarker.getLatLng()
            ]);
        }
    }

    // Function to handle location selection
    function handleLocationSelect(latlng, isStart) {
        const marker = isStart ? startMarker : endMarker;
        const inputField = document.querySelector(`input[name="${isStart ? 'start_location' : 'end_location'}"]`);
        
        // Reverse geocode to get address
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latlng.lat}&lon=${latlng.lng}`)
            .then(response => response.json())
            .then(data => {
                if (data.display_name) {
                    inputField.value = data.display_name;
                }
            });

        if (marker) {
            marker.setLatLng(latlng);
        } else {
            const newMarker = L.marker(latlng, {
                draggable: true
            }).addTo(map);

            newMarker.on('dragend', function(e) {
                handleLocationSelect(e.target.getLatLng(), isStart);
            });

            if (isStart) {
                startMarker = newMarker;
            } else {
                endMarker = newMarker;
            }
        }

        updateRoute();
    }

    // Handle map clicks
    map.on('click', function(e) {
        handleLocationSelect(e.latlng, isSelectingStart);
        isSelectingStart = !isSelectingStart;
    });

    // Handle input field changes
    const startInput = document.querySelector('input[name="start_location"]');
    const endInput = document.querySelector('input[name="end_location"]');

    startInput.addEventListener('change', function() {
        if (this.value) {
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(this.value)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        const latlng = L.latLng(data[0].lat, data[0].lon);
                        handleLocationSelect(latlng, true);
                        map.setView(latlng, 13);
                    }
                });
        }
    });

    endInput.addEventListener('change', function() {
        if (this.value) {
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(this.value)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.length > 0) {
                        const latlng = L.latLng(data[0].lat, data[0].lon);
                        handleLocationSelect(latlng, false);
                        map.setView(latlng, 13);
                    }
                });
        }
    });
});
</script>
{% endblock %}
